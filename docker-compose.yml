# Tryvanta Social — local development stack
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: tryvanta
      POSTGRES_PASSWORD: tryvanta
      POSTGRES_DB: tryvanta_social
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tryvanta"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: [redisdata:/data]

  api:
    build: ./backend
    env_file: [.env]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
    ports: ["8000:8000"]
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes: ["./backend:/srv"]

  worker:
    build: ./backend
    env_file: [.env]
    depends_on: [redis, db]
    command: arq app.workers.ingest.WorkerSettings

  web:
    build: ./web
    env_file: [.env]
    depends_on: [api]
    ports: ["3000:3000"]

volumes: {pgdata: {}, redisdata: {}}
