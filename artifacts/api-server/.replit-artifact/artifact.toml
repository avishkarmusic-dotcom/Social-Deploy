kind = "api"
previewPath = "/api"
title = "Tryvanta Social API"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "bash ../../backend/run-replit.sh"

[services.production]

[services.production.build]
args = ["bash", "-lc", "python -m compileall -q ../../backend/app"]

[services.production.build.env]
PYTHONUNBUFFERED = "1"

[services.production.run]
args = ["bash", "../../backend/run-replit.sh"]

[services.production.run.env]
PYTHONUNBUFFERED = "1"

[services.production.health.startup]
path = "/api/healthz"
